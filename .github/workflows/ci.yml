name: Tests
on:
  push:
  pull_request:

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
